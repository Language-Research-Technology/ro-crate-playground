networks:
  playground:
    name: playground
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  app_files:

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: rocrate-app
    hostname: app
    environment:
      NODE_ENV: production
    expose:
      - "8080"
    networks:
      - playground
    volumes:
      - ./app/configuration.json:/app/configuration.json:ro
      - app_files:/opt/storage/files
    command: npm run prod

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /app
    container_name: rocrate-ui
    hostname: ui
    restart: unless-stopped
    environment:
      VITE_API_URL: /app
    expose:
      - "4173"
    depends_on:
      - app
    networks:
      - playground

  caddy:
    image: caddy:2-alpine
    container_name: rocrate-caddy
    hostname: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - ui
    networks:
      - playground

