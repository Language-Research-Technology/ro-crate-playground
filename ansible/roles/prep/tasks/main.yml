---

- name: Update and upgrade apt packages
  become: true
  apt:
    upgrade: yes
    update_cache: yes
  tags:
    - update
    
- name: Install prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gcc
      - g++
      - make
      - lsof
      - gpg
      - git
      - vim
      - golang
      - screen
      - tree
    state: present
  tags:
    - prereqs

- name: Create Docker APT keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags:
    - docker

- name: Install Docker APT repository key
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  tags:
    - docker

- name: Configure Docker APT repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
    update_cache: yes
  tags:
    - docker

- name: Install Docker Engine and Compose
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  tags:
    - docker

- name: Ensure Docker is enabled and started
  service:
    name: docker
    enabled: yes
    state: started
  tags:
    - docker

- name: Add deployment user to the Docker group
  user:
    name: "{{ DATA_USER }}"
    groups: docker
    append: yes
  tags:
    - docker

- name: Add github key to "{{ DATA_USER }}"
  become: true
  become_user: "{{ DATA_USER }}"
  template:
    src: "{{ GITHUB_KEY_LOCATION }}"
    dest: "{{ GITHUB_KEY_PATH }}"
    mode: 0600
  tags:
    - git

- name: Download the NodeSource LTS setup script
  get_url:
    url: https://deb.nodesource.com/setup_lts.x
    dest: /tmp/nodesource_setup_lts.sh
    mode: "0755"
  tags:
    - node

- name: Configure the NodeSource LTS repository
  command: /bin/bash /tmp/nodesource_setup_lts.sh
  args:
    creates: /etc/apt/sources.list.d/nodesource.sources
  tags:
    - node

- name: Install nodejs
  apt:
    name: nodejs
    state: latest
    update_cache: yes
  tags:
    - node
    
- name: Mount ext4 p device by "{{ MOUNT_STORAGE_DEVICE_UUID }}"
  when: MOUNT_STORAGE_DEVICE_UUID is defined
  ansible.posix.mount:
    path: /opt/storage
    src: UUID={{ MOUNT_STORAGE_DEVICE_UUID }}
    fstype: ext4
    opts: noatime
    state: mounted
  tags:
    - volume

- name: Ensure application file storage exists
  file:
    path: "{{ TMP_DIR }}"
    state: directory
    owner: "{{ DATA_USER }}"
    group: "{{ DATA_USER }}"
    mode: "0755"
  tags:
    - volume

