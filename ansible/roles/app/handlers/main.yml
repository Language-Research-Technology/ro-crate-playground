---

- name: restart-app
  community.docker.docker_compose_v2:
    build: no
    project_src: "{{ APP_DIR }}"
    recreate: always
    restarted: yes
  register: restart_app_output

- name: restart-app-api
  community.docker.docker_compose_v2:
    build: no
    project_src: "{{ APP_DIR }}"
    services:
        - api
        - api-docs
    restarted: true
    state: present

- name: output from restart-app handler
  debug:
    msg: "{{ restart_app_output }}"

- name: restart-app
  community.docker.docker_compose_v2:
    build: no
    project_src: "{{ APP_DIR }}"
    services:
        - api-docs
        - elasticsearch
        - db
        - api
    restarted: true
    state: present
