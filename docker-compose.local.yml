networks:
  playground:
    name: playground-local
    driver: bridge

volumes:
  app_files:

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: rocrate-app-local
    hostname: app
    environment:
      NODE_ENV: production
    expose:
      - "8080"
    networks:
      - playground
    volumes:
      - ./app/configuration.json:/app/configuration.json:ro
      - app_files:/opt/storage/files
    command: npm run prod

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /app
    container_name: rocrate-ui-local
    hostname: ui
    expose:
      - "4173"
    depends_on:
      - app
    networks:
      - playground

  caddy:
    image: caddy:2-alpine
    container_name: rocrate-caddy-local
    hostname: caddy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
      - ui
    networks:
      - playground
